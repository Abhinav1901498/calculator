<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scientific Calculator 💡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { touch-action: manipulation; }
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://img.freepik.com/free-photo/blue-blank-notepad-with-copy-space_23-2148475334.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .calculator {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2rem;
      padding: 1.5rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 500px; /* मोबाइल पर फुल स्क्रीन, डेस्कटॉप पर अच्छा साइज */
      border: 1px solid rgba(255,255,255,0.2);
    }

    #display {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      padding: 1.2rem 1rem;
      text-align: right;
      font-size: 2.5rem;
      font-weight: 600;
      color: #000;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.2);
      margin-bottom: 1rem;
      border: none;
      width: 100%;
      box-sizing: border-box;
    }

    .btn {
      border-radius: 1rem;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 1.1rem;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
      min-height: 56px; /* मोबाइल टच के लिए अच्छा साइज */
      user-select: none;
    }

    .calc-btn {
      background: linear-gradient(145deg, #ff85f7, #ff5fd1);
      box-shadow: 0 4px 15px rgba(255, 95, 209, 0.5);
    }

    .operator-btn {
      background: linear-gradient(145deg, #7f5fff, #3d00ff);
      box-shadow: 0 4px 15px rgba(63, 0, 255, 0.5);
    }

    .special-btn {
      background: linear-gradient(145deg, #ff3d00, #ff8c42);
      box-shadow: 0 4px 15px rgba(255, 140, 66, 0.5);
    }

    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .grid {
      display: grid;
      gap: 0.75rem;
    }

    /* मोबाइल के लिए ग्रिड कॉलम्स */
    .grid-5 { grid-template-columns: repeat(5, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 480px) {
      .calculator { padding: 1.2rem; border-radius: 1.5rem; }
      #display { font-size: 2.2rem; padding: 1rem; }
      .btn { font-size: 1rem; padding: 1rem; min-height: 52px; }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-black">Scientific Calculator</h1>
      <button id="bg-toggle" class="calc-btn text-xl">☀️</button>
    </div>

    <input id="display" type="text" value="0" readonly>

    <!-- Scientific Buttons -->
    <div class="grid grid-5 mb-4">
      <button class="calc-btn" onclick="memory('MC')">MC</button>
      <button class="calc-btn" onclick="memory('MR')">MR</button>
      <button class="calc-btn" onclick="memory('M+')">M+</button>
      <button class="calc-btn" onclick="memory('M-')">M-</button>
      <button class="calc-btn" onclick="appendValue('Math.PI')">π</button>

      <button class="calc-btn" onclick="appendValue('Math.E')">e</button>
      <button class="calc-btn" onclick="appendValue('(')">(</button>
      <button class="calc-btn" onclick="appendValue(')')">)</button>
      <button class="calc-btn" onclick="appendValue('%')">%</button>
      <button class="calc-btn" onclick="appendValue('!')">n!</button>

      <button class="calc-btn" onclick="appendValue('Math.sqrt(')">√</button>
      <button class="calc-btn" onclick="appendValue('**2')">x²</button>
      <button class="calc-btn" onclick="appendValue('**3')">x³</button>
      <button class="calc-btn" onclick="appendValue('**')">xʸ</button>
      <button class="calc-btn" onclick="appendValue('1/')">1/x</button>

      <button class="calc-btn" onclick="appendValue('Math.sin(')">sin</button>
      <button class="calc-btn" onclick="appendValue('Math.cos(')">cos</button>
      <button class="calc-btn" onclick="appendValue('Math.tan(')">tan</button>
      <button class="calc-btn" onclick="appendValue('Math.log(')">ln</button>
      <button class="calc-btn" onclick="appendValue('Math.log10(')">log</button>
    </div>

    <!-- Standard Buttons -->
    <div class="grid grid-4">
      <button class="special-btn" onclick="clearDisplay()">AC</button>
      <button class="calc-btn" onclick="clearEntry()">C</button>
      <button class="calc-btn" onclick="backspace()">⌫</button>
      <button class="operator-btn" onclick="appendValue('/')">÷</button>

      <button class="calc-btn" onclick="appendValue('7')">7</button>
      <button class="calc-btn" onclick="appendValue('8')">8</button>
      <button class="calc-btn" onclick="appendValue('9')">9</button>
      <button class="operator-btn" onclick="appendValue('*')">×</button>

      <button class="calc-btn" onclick="appendValue('4')">4</button>
      <button class="calc-btn" onclick="appendValue('5')">5</button>
      <button class="calc-btn" onclick="appendValue('6')">6</button>
      <button class="operator-btn" onclick="appendValue('-')">-</button>

      <button class="calc-btn" onclick="appendValue('1')">1</button>
      <button class="calc-btn" onclick="appendValue('2')">2</button>
      <button class="calc-btn" onclick="appendValue('3')">3</button>
      <button class="operator-btn" onclick="appendValue('+')">+</button>

      <button class="calc-btn grid-col-span-2" style="grid-column: span 2;" onclick="appendValue('0')">0</button>
      <button class="calc-btn" onclick="appendValue('.')">.</button>
      <button class="operator-btn" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let memoryValue = 0;

    function appendValue(val) {
      if (display.value === "0" && ![".", "(", "Math."].some(v => val.startsWith(v))) display.value = "";
      display.value += val;
    }

    function clearDisplay() { display.value = "0"; }
    function clearEntry() { display.value = "0"; }
    function backspace() { display.value = display.value.slice(0, -1) || "0"; }

    function calculate() {
      try {
        let exp = display.value
          .replace(/π/g, 'Math.PI')
          .replace(/e/g, 'Math.E')
          .replace(/(\d+)!/g, 'factorial($1)')
          .replace(/\^/g, '**');
        display.value = eval(exp);
      } catch {
        display.value = "Error";
      }
    }

    function memory(action) {
      const val = parseFloat(display.value) || 0;
      switch(action) {
        case 'MC': memoryValue = 0; break;
        case 'MR': display.value = memoryValue; break;
        case 'M+': memoryValue += val; break;
        case 'M-': memoryValue -= val; break;
      }
    }

    function factorial(n) {
      if (n === 0 || n === 1) return 1;
      if (n > 170) return Infinity;
      let res = 1;
      for (let i = 2; i <= n; i++) res *= i;
      return res;
    }

    // Background Toggle
    const backgrounds = [
      'https://img.freepik.com/free-photo/blue-blank-notepad-with-copy-space_23-2148475334.jpg',
      'https://images.unsplash.com/photo-1507525428034-b723cf961d3e',
      'https://images.unsplash.com/photo-1557682250-33bd709cbe85'
    ];
    let idx = 0;
    document.getElementById('bg-toggle').addEventListener('click', () => {
      idx = (idx + 1) % backgrounds.length;
      document.body.style.backgroundImage = `url('${backgrounds[idx]}')`;
    });
  </script>
</body>
</html>
